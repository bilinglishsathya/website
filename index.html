    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; line-height: 1.6; font-size: 14px; }
        
        .logo-area { text-align: center; padding: 25px 20px 15px 20px; background: #0f172a; }
        .logo-area img { max-width: 220px; width: 100%; height: auto; }
        header { background: #1e293b; color: white; padding: 20px 15px; text-align: center; border-bottom: 4px solid #a855f7; }
        header h1 { font-size: 22px; letter-spacing: 1px; font-weight: bold; text-transform: uppercase; color: #f8fafc; }
        header p { font-size: 13px; color: #94a3b8; margin-top: 4px; font-style: italic; }

        .nav-bar { display: flex; flex-wrap: wrap; background: #090d16; justify-content: center; padding: 8px; border-bottom: 1px solid #1e293b; }
        .nav-link { color: #cbd5e1; text-decoration: none; padding: 6px 10px; font-size: 11px; text-transform: uppercase; font-weight: bold; transition: color 0.2s; }
        .nav-link:hover { color: #c084fc; }

        .controls-bar {
            background: #1e293b;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #334155;
        }
        .translate-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .translate-label {
            font-weight: bold;
            color: #c084fc;
            font-size: 12px;
        }
        #languageSelect {
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #a855f7;
            background: white;
            color: #4a0072;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            max-width: 180px;
        }
        #languageSelect:hover { background: #f0e6ff; }
        #languageSelect:focus { outline: none; box-shadow: 0 0 0 3px rgba(74, 0, 114, 0.2); }

        .voice-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .btn-listen {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            width: 100%;
            max-width: 320px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            color: white;
            text-align: center;
        }
        .btn-r { background: #ef4444; }
        .btn-s { background: #f57c00; display: none; }
        .btn-p { background: #3b82f6; display: none; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        section { background: #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid #334155; }
        h2 { font-size: 15px; color: #c084fc; text-transform: uppercase; margin-bottom: 12px; border-left: 4px solid #a855f7; padding-left: 8px; letter-spacing: 0.5px; }
        h3 { font-size: 14px; color: #f8fafc; text-transform: uppercase; margin: 15px 0 8px 0; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        p { margin-bottom: 12px; text-align: justify; color: #cbd5e1; font-size: 13.5px; }

        .timeline {
            list-style: none;
            margin: 12px 0;
            padding-left: 5px;
        }
        .timeline-item {
            position: relative;
            padding-left: 15px;
            margin-bottom: 8px;
            border-left: 2px solid #a855f7;
            font-size: 12.5px;
            color: #cbd5e1;
        }
        .timeline-item strong { color: #f8fafc; }

        .featured-app {
            background: linear-gradient(135deg, #1a1a3e, #2d1b4e);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            border: 2px solid #a855f7;
            text-align: center;
        }
        .featured-app img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .featured-app h3 {
            color: #60a5fa;
            font-size: 16px;
            margin-top: 0;
            border: none;
        }
        .featured-app p {
            font-size: 13px;
            margin-bottom: 15px;
            color: #cbd5e1;
        }
        .featured-app a {
            display: inline-block;
            background: #60a5fa;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            transition: background 0.2s;
        }
        .featured-app a:hover { background: #3b82f6; }

        .apps-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0;
        }
        .app-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            transition: all 0.2s;
        }
        .app-card:hover {
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }
        .app-card img {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
            margin-bottom: 8px;
        }
        .app-card a {
            display: block;
            color: #c084fc;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            text-transform: uppercase;
        }
        .app-card a:hover { color: #60a5fa; }

        .pricing-zone {
            background: #1a1705;
            border: 2px dashed #f59e0b;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            margin-top: 15px;
        }
        .price-tag {
            font-size: 18px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 12px;
        }
        .pay-btn {
            display: block;
            width: 100%;
            max-width: 260px;
            margin: 10px auto;
            padding: 12px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 13.5px;
            text-decoration: none;
            text-transform: uppercase;
            text-align: center;
            color: white;
            background: #0284c7;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        .pay-btn:hover { background: #1d9fd9; }

        #google_translate_element { display: none; }
        .goog-te-banner-frame.skiptranslate { display: none !important; }
        .goog-te-gadget { font-family: sans-serif !important; color: transparent !important; }
        .goog-te-gadget span { display: none; }

        footer {
            background: #090d16;
            color: #94a3b8;
            text-align: center;
            padding: 15px;
            font-size: 11px;
            margin-top: 25px;
            border-top: 3px solid #a855f7;
        }
        .footer-socials {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .footer-socials a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 11.5px;
            padding: 6px 12px;
            background: #334155;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .footer-socials a:hover { background: #a855f7; }
        .footer-email {
            display: inline-block;
            margin-bottom: 10px;
        }
        .footer-email a {
            color: #0284c7;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-email a:hover { text-decoration: underline; }
